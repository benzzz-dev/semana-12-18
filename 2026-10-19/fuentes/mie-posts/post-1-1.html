<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:"Inter";src:url("fonts/Inter-Regular.otf");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/Inter-SemiBold.otf");font-weight:600}
@font-face{font-family:"Inter";src:url("fonts/Inter-Bold.otf");font-weight:700}
@font-face{font-family:"Inter";src:url("fonts/Inter-ExtraBold.otf");font-weight:800}
@font-face{font-family:"Inter";src:url("fonts/Inter-Black.otf");font-weight:900}
@font-face{font-family:"DejaVu Sans Mono";src:url("fonts/DejaVuSansMono.ttf");font-weight:400}
@font-face{font-family:"DejaVu Sans Mono";src:url("fonts/DejaVuSansMono-Bold.ttf");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ece8fd}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:"Inter",sans-serif;color:#1e1b4b}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#ece8fd 0%,#e3e6fb 48%,#f6e6f1 100%)}
.brand{position:absolute;left:80px;top:236px;display:flex;align-items:center;gap:18px;z-index:20}
.brand .ico{width:68px;height:68px;border-radius:18px;background:#5b4ce6;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(91,76,230,.3)}
.brand .ico svg{width:40px;height:40px}
.brand .wm{font-weight:800;font-size:46px;letter-spacing:-0.03em;color:#1e1b4b}
.brand .wm i{font-style:normal;color:#5b4ce6}
.foot{position:absolute;left:80px;bottom:400px;font-family:"DejaVu Sans Mono",monospace;font-size:34px;color:#1e1b4b;opacity:.7;letter-spacing:.04em;z-index:20}
.lbl{font-family:"DejaVu Sans Mono",monospace;font-weight:700;color:#6d28d9;letter-spacing:.16em;text-transform:uppercase;font-size:34px}
.ttl{font-weight:900;letter-spacing:-0.045em;line-height:.98;color:#1e1b4b}
.kw{color:#5b21b6}
.hl{background-image:linear-gradient(#c4b5fd,#c4b5fd);background-repeat:no-repeat;background-position:0 88%;background-size:100% 30%;padding:0 6px}

html,body{height:1350px}
.brand{top:70px}
.foot{bottom:64px;font-size:30px}
.counter{position:absolute;right:80px;top:88px;font-family:"DejaVu Sans Mono",monospace;font-weight:700;color:#6d28d9;font-size:32px;letter-spacing:.08em}
.swipe{position:absolute;right:80px;bottom:60px;font-family:"DejaVu Sans Mono",monospace;font-weight:700;color:#6d28d9;font-size:34px}
.lbl.t{position:absolute;left:80px;top:200px;font-size:30px}
.q{position:absolute;left:80px;right:80px;top:255px;font-size:92px}
.chat{position:absolute;left:80px;right:80px;top:560px;background:#efeae2;border-radius:44px;padding:34px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(30,27,75,.12)}
.msg{max-width:82%;padding:20px 28px 14px;font-size:38px;font-weight:600;line-height:1.2;color:#111;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.msg small{display:block;text-align:right;font-family:"DejaVu Sans Mono",monospace;font-size:22px;color:#667;margin-top:4px;font-weight:400}
.in{align-self:flex-start;background:#fff;border-radius:30px 30px 30px 8px}
.out{align-self:flex-end;background:#d9fdd3;border-radius:30px 30px 8px 30px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.chip{background:#fff;border:3px solid #5b4ce6;color:#5b21b6;font-weight:800;font-size:32px;padding:10px 22px;border-radius:999px}
.chip.f{background:#5b4ce6;color:#fff}
.pl{display:flex;justify-content:space-between;gap:30px;font-size:36px;padding:6px 0;border-bottom:2px dashed rgba(0,0,0,.12)}
.pl:last-of-type{border-bottom:0}
.map{height:170px;border-radius:20px;margin-top:12px;position:relative;overflow:hidden;background:#e5e7eb;background-image:linear-gradient(90deg,rgba(255,255,255,.9) 14px,transparent 14px),linear-gradient(rgba(255,255,255,.9) 14px,transparent 14px);background-size:120px 120px,90px 90px;background-position:40px 0,0 30px}
.pin{position:absolute;left:46%;top:24%;width:60px;height:60px;border-radius:50% 50% 50% 0;background:#e11d48;transform:rotate(-45deg)}
.pin::after{content:"";position:absolute;left:19px;top:19px;width:22px;height:22px;border-radius:50%;background:#fff}
.lnk{color:#2563eb;font-family:"DejaVu Sans Mono",monospace;font-size:28px;font-weight:700}
.auto{position:absolute;left:80px;bottom:130px;font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:28px;color:#6d28d9;letter-spacing:.1em}

.card2{display:flex;align-items:center;gap:24px;background:#fff;border-radius:30px;padding:24px 30px;box-shadow:0 14px 34px rgba(30,27,75,.12);border:4px solid #5b4ce6}
.card2 .ck{width:80px;height:80px;border-radius:22px;background:#5b4ce6;display:flex;align-items:center;justify-content:center;flex:none}
.card2 .ck svg{width:48px;height:48px}
.card2 b{display:block;font-size:44px;font-weight:900;letter-spacing:-0.03em}
.card2 span{font-family:"DejaVu Sans Mono",monospace;font-size:28px;color:#6d28d9;font-weight:700}
.card2.off{border-color:#cbd5e1;opacity:.85}
.card2.off b{color:#94a3b8;text-decoration:line-through;text-decoration-thickness:6px;text-decoration-color:#e11d48}
.card2.off span{color:#94a3b8}
.card2.off .ck{background:#cbd5e1}
.card2.free{border:4px dashed #6d28d9;background:rgba(255,255,255,.6)}
.card2.free .ck{background:#ede9fe;color:#5b21b6;font-size:46px;font-weight:900}
.nt{display:flex;gap:22px;align-items:flex-start;background:#fff;border-radius:32px;padding:24px 28px;box-shadow:0 14px 34px rgba(30,27,75,.12)}
.nt .i{width:76px;height:76px;border-radius:20px;background:#5b4ce6;display:flex;align-items:center;justify-content:center;flex:none}
.nt .i svg{width:44px;height:44px}
.nt .h{display:flex;justify-content:space-between;font-family:"DejaVu Sans Mono",monospace;font-size:26px;color:#444;font-weight:700}
.nt .b{font-size:36px;font-weight:600;margin-top:6px;line-height:1.2}
.step{position:absolute;left:80px;right:80px;top:255px;font-size:96px}
.box{position:absolute;left:80px;right:80px}
</style></head><body><div id="root"><div class="bg"></div><div class="brand"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="wm">Reservum<i>.</i></div></div><div class="counter">1/6</div><div class="lbl t">Lista de espera automática</div><div class="ttl" style="position:absolute;left:80px;right:80px;top:255px;font-size:100px">Hora que se cancela, hora que se <span class="kw hl">vuelve a llenar</span></div><div class="box" style="top:740px;display:flex;flex-direction:column;gap:26px"><div class="card2 off"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div><b>Mañana 16:00 · Javiera</b><span>CANCELADA</span></div></div><div style="font-size:64px;color:#5b4ce6;font-weight:900;padding-left:30px;line-height:1">↓</div><div class="card2"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div><b>Mañana 16:00 · Camila</b><span>REASIGNADA SOLA</span></div></div></div><div class="swipe">desliza →</div><div class="foot">reservum.cl</div></div></body></html>
