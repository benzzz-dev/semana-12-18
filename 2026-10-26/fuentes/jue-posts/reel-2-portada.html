<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:"Inter";src:url("fonts/Inter-Regular.otf");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/Inter-SemiBold.otf");font-weight:600}
@font-face{font-family:"Inter";src:url("fonts/Inter-Bold.otf");font-weight:700}
@font-face{font-family:"Inter";src:url("fonts/Inter-ExtraBold.otf");font-weight:800}
@font-face{font-family:"Inter";src:url("fonts/Inter-Black.otf");font-weight:900}
@font-face{font-family:"DejaVu Sans Mono";src:url("fonts/DejaVuSansMono.ttf");font-weight:400}
@font-face{font-family:"DejaVu Sans Mono";src:url("fonts/DejaVuSansMono-Bold.ttf");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ece8fd}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:"Inter",sans-serif;color:#1e1b4b}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#ece8fd 0%,#e3e6fb 48%,#f6e6f1 100%)}
.brand{position:absolute;left:80px;top:236px;display:flex;align-items:center;gap:18px;z-index:20}
.brand .ico{width:68px;height:68px;border-radius:18px;background:#5b4ce6;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(91,76,230,.3)}
.brand .ico svg{width:40px;height:40px}
.brand .wm{font-weight:800;font-size:46px;letter-spacing:-0.03em;color:#1e1b4b}
.brand .wm i{font-style:normal;color:#5b4ce6}
.foot{position:absolute;left:80px;bottom:400px;font-family:"DejaVu Sans Mono",monospace;font-size:34px;color:#1e1b4b;opacity:.7;letter-spacing:.04em;z-index:20}
.lbl{font-family:"DejaVu Sans Mono",monospace;font-weight:700;color:#6d28d9;letter-spacing:.16em;text-transform:uppercase;font-size:34px}
.ttl{font-weight:900;letter-spacing:-0.045em;line-height:.98;color:#1e1b4b}
.kw{color:#5b21b6}
.hl{background-image:linear-gradient(#c4b5fd,#c4b5fd);background-repeat:no-repeat;background-position:0 88%;background-size:100% 30%;padding:0 6px}
.abs{position:absolute;left:80px;right:140px}
.cta{display:inline-flex;background:#5b4ce6;color:#fff;font-weight:800;font-size:50px;padding:24px 44px;border-radius:999px}
.web{position:absolute;right:-30px;top:150px;width:340px;opacity:.16}
.vs{display:flex;gap:24px}
.vs div{flex:1;border-radius:40px;padding:34px 30px}
.vs .n{background:#e5e7eb}.vs .s{background:#5b4ce6;color:#fff}
.vs b{display:block;font-weight:900;font-size:150px;letter-spacing:-0.06em;line-height:1}
.vs .n b{color:#6b7280}
.vs span{display:block;font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:30px;letter-spacing:.1em;margin-top:10px}
.notif{display:flex;gap:22px;align-items:center;background:#fff;border-radius:34px;padding:26px 30px;box-shadow:0 18px 40px rgba(30,27,75,.15)}
.notif .ic{width:80px;height:80px;border-radius:22px;background:#5b4ce6;flex:none;display:flex;align-items:center;justify-content:center}
.notif .ic svg{width:48px;height:48px}
.notif .h{font-family:"DejaVu Sans Mono",monospace;font-size:28px;color:#6b7280;font-weight:700}
.notif .b{font-size:44px;font-weight:800;color:#111;line-height:1.15;margin-top:4px}</style></head><body><div id="root"><div class="bg"></div><div class="brand"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="wm">Reservum<i>.</i></div></div><div class="lbl abs" style="top:430px">Salón de uñas · 3 semanas después</div>
<div class="ttl abs" style="top:500px;font-size:170px">Te toca <span class="kw hl">retoque.</span></div>
<div class="abs notif" style="top:960px"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div><div class="h">WHATSAPP · AHORA</div><div class="b">Hola Fran, ya van 3 semanas. ¿Agendamos tu retoque?</div></div></div>
<div class="abs" style="top:1300px"><span class="cta">La clienta vuelve sola</span></div><div class="foot">reservum.cl</div></div></body></html>
